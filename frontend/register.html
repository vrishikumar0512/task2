<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ShopEase — Full Stack E-Commerce Store - Register">
  <title>ShopEase — Register</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header / Navigation -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <span class="logo-icon">🛍️</span>
        <span class="logo-text">ShopEase</span>
      </a>
      <nav class="nav-links" id="nav-links-container">
        <a href="index.html" class="nav-link">Home</a>
        <a href="index.html" class="nav-link">Products</a>
        <a href="cart.html" class="nav-link" id="nav-cart-link">Cart (0)</a>
        <a href="login.html" class="nav-link" id="nav-auth-link">Login</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container auth-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <span class="auth-icon">📝</span>
          <h1 class="auth-title">Create Account</h1>
          <p class="auth-subtitle">Join ShopEase to enjoy seamless shopping</p>
        </div>

        <div id="register-alert" class="auth-alert" role="alert"></div>

        <form id="register-form" class="auth-form" novalidate>
          <div class="form-group">
            <label for="register-name" class="form-label">Full Name</label>
            <input 
              type="text" 
              id="register-name" 
              name="name" 
              class="form-input" 
              placeholder="e.g. Pavithra" 
              required 
              autocomplete="name"
            />
          </div>

          <div class="form-group">
            <label for="register-email" class="form-label">Email</label>
            <input 
              type="email" 
              id="register-email" 
              name="email" 
              class="form-input" 
              placeholder="e.g. pavithra@example.com" 
              required 
              autocomplete="email"
            />
          </div>

          <div class="form-group">
            <label for="register-password" class="form-label">Password</label>
            <input 
              type="password" 
              id="register-password" 
              name="password" 
              class="form-input" 
              placeholder="At least 6 characters" 
              required 
              autocomplete="new-password"
            />
            <span class="form-hint">Must be at least 6 characters long</span>
          </div>

          <div class="form-group">
            <label for="register-confirm-password" class="form-label">Confirm Password</label>
            <input 
              type="password" 
              id="register-confirm-password" 
              name="confirmPassword" 
              class="form-input" 
              placeholder="Re-enter your password" 
              required 
              autocomplete="new-password"
            />
          </div>

          <button type="submit" id="register-submit-btn" class="btn btn-primary btn-block">
            Create Account
          </button>
        </form>

        <div class="auth-footer">
          Already have an account? <a href="login.html" class="auth-link">Login</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-content">
      <p>&copy; 2026 ShopEase — Full Stack E-Commerce Store. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/mockData.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
