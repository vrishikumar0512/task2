<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ShopEase — Full Stack E-Commerce Store - Shopping Cart">
  <title>ShopEase — Shopping Cart</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header / Navigation -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <span class="logo-icon">🛍️</span>
        <span class="logo-text">ShopEase</span>
      </a>
      <nav class="nav-links" id="nav-links-container">
        <a href="index.html" class="nav-link">Home</a>
        <a href="index.html" class="nav-link">Products</a>
        <a href="cart.html" class="nav-link active" id="nav-cart-link">Cart (0)</a>
        <a href="login.html" class="nav-link" id="nav-auth-link">Login</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container">
      <section class="section-header">
        <h1 class="section-title">Shopping Cart</h1>
        <p class="section-subtitle">Review your selected items, adjust quantities, and proceed when ready.</p>
      </section>

      <!-- Dynamic Cart Container -->
      <section class="cart-section" id="cart-container">
        <!-- Rendered dynamically via JavaScript from localStorage -->
      </section>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-content">
      <p>&copy; 2026 ShopEase — Full Stack E-Commerce Store. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/mockData.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
