<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ShopEase — Full Stack E-Commerce Store - Login">
  <title>ShopEase — Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header / Navigation -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <span class="logo-icon">🛍️</span>
        <span class="logo-text">ShopEase</span>
      </a>
      <nav class="nav-links" id="nav-links-container">
        <a href="index.html" class="nav-link">Home</a>
        <a href="index.html" class="nav-link">Products</a>
        <a href="cart.html" class="nav-link" id="nav-cart-link">Cart (0)</a>
        <a href="login.html" class="nav-link active" id="nav-auth-link">Login</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container auth-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <span class="auth-icon">🔐</span>
          <h1 class="auth-title">Welcome Back</h1>
          <p class="auth-subtitle">Login to your ShopEase account</p>
        </div>

        <div id="login-alert" class="auth-alert" role="alert"></div>

        <form id="login-form" class="auth-form" novalidate>
          <div class="form-group">
            <label for="login-email" class="form-label">Email</label>
            <input 
              type="email" 
              id="login-email" 
              name="email" 
              class="form-input" 
              placeholder="e.g. pavithra@example.com" 
              required 
              autocomplete="email"
            />
          </div>

          <div class="form-group">
            <label for="login-password" class="form-label">Password</label>
            <input 
              type="password" 
              id="login-password" 
              name="password" 
              class="form-input" 
              placeholder="Enter your password" 
              required 
              autocomplete="current-password"
            />
          </div>

          <button type="submit" id="login-submit-btn" class="btn btn-primary btn-block">
            Login
          </button>
        </form>

        <div class="auth-footer">
          Don't have an account? <a href="register.html" class="auth-link">Register</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-content">
      <p>&copy; 2026 ShopEase — Full Stack E-Commerce Store. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/mockData.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
