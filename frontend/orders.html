<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ShopEase — Full Stack E-Commerce Store - Order History">
  <title>ShopEase — Order History</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Header / Navigation -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <span class="logo-icon">🛍️</span>
        <span class="logo-text">ShopEase</span>
      </a>
      <nav class="nav-links" id="nav-links-container">
        <a href="index.html" class="nav-link">Home</a>
        <a href="index.html" class="nav-link">Products</a>
        <a href="cart.html" class="nav-link" id="nav-cart-link">Cart (0)</a>
        <a href="login.html" class="nav-link" id="nav-auth-link">Login</a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-content">
    <div class="container">
      <!-- Section Header -->
      <section class="section-header">
        <h1 class="section-title">Order History</h1>
        <p class="section-subtitle">Track and review all your previous purchases on ShopEase.</p>
      </section>

      <!-- Alert Box -->
      <div id="orders-alert" class="auth-alert" role="alert"></div>

      <!-- Orders List Container (Populated dynamically) -->
      <div id="orders-container" class="orders-section">
        <!-- Loading state -->
        <div class="loading-state">
          <p>Loading your orders...</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Order Details Modal -->
  <div id="order-details-modal" class="order-modal" style="display: none;">
    <div class="order-modal-backdrop" id="modal-backdrop"></div>
    <div class="order-modal-content">
      <div class="order-modal-header">
        <h2 class="order-modal-title">Order Details</h2>
        <button type="button" class="order-modal-close" id="modal-close-btn" aria-label="Close modal">&times;</button>
      </div>
      <div class="order-modal-body" id="modal-body-content">
        <!-- Rendered dynamically from GET /api/orders/:id -->
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-content">
      <p>&copy; 2026 ShopEase — Full Stack E-Commerce Store. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/mockData.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
