<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=frontend/index.html">
  <title>ShopEase — Redirecting to Store</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f8fafc;
      color: #0f172a;
    }
    .redirect-card {
      text-align: center;
      background: #ffffff;
      padding: 32px 40px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.08);
      max-width: 440px;
    }
    .redirect-icon {
      font-size: 2.5rem;
      margin-bottom: 12px;
    }
    .btn {
      display: inline-block;
      margin-top: 16px;
      padding: 10px 20px;
      background: #2563eb;
      color: #ffffff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
    }
  </style>
  <script>
    // Seamless instant redirect for Live Server and static hosting
    window.location.replace("frontend/index.html");
  </script>
</head>
<body>
  <div class="redirect-card">
    <div class="redirect-icon">🛍️</div>
    <h2>Opening ShopEase Store...</h2>
    <p>If you are not redirected automatically, please click below:</p>
    <a href="frontend/index.html" class="btn">Enter ShopEase</a>
  </div>
</body>
</html>
